upstream fastapi_app {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    location / {
        proxy_pass http://fastapi_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Serve static uploads directory
    location /uploads/ {
        alias /app/uploads/;
    }
}
