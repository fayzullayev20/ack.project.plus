version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: architect_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/app/uploads:ro
    depends_on:
      - api

  api:
    build: .
    container_name: architect_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - db_host=db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgres:15-alpine
    container_name: architect_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${db_user:-postgres}
      - POSTGRES_PASSWORD=${db_pass:-postgres}
      - POSTGRES_DB=${db_name:-architect_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${db_user:-postgres} -d ${db_name:-architect_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
